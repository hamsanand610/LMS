packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts unless allowed here.
# true  = allow the package's install/postinstall script
# false = skip it (package ships prebuilt binaries)
allowBuilds:
  sharp: false
  unrs-resolver: false
  argon2: true
  esbuild: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - tailwind-merge@3.7.0
  - zod@4.6.4

# Security floors for transitive dependencies (Phase 6): multer is the upload parser behind
# @nestjs/platform-express; 2.4 closes the multipart denial-of-service advisories of 2.2.
overrides:
  multer: ^2.4.0
  # Step 6 audit: proxy-addr 2.0.8 (Express's address resolution; GHSA advisory on IPv4-mapped IPv6
  # subnets, not reachable with this API's hop-count trust, closed anyway) and sharp 0.35.5 (Next's
  # image library; librsvg advisory).
  proxy-addr: ^2.0.8
  sharp: ^0.35.5
