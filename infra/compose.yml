name: lms

# Local development services. Profiles:
#   core   - postgres, minio (+ bucket init), mailpit          (default for development)
#   tools  - adminer (database browser)
#   judge0 - not included here; see infra/judge0/README.md (Linux hosts only, Phase 4)
#
# Environment values come from the repository root .env (copy .env.example → .env).

services:
  postgres:
    image: postgres:16-alpine
    profiles: ['core']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Object storage: MinIO as built by Chainguard, because MinIO no longer publishes images
  # (ADR-0017). It runs as an unprivileged user (65532); the image it replaces ran as root.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ['core']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    depends_on:
      minio-volume:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lms_minio_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # A volume the old image wrote belongs to root, which the server can no longer write to. This
  # hands root's files to the server's user before it starts; on a volume already handed over, or
  # a new one, it changes nothing. Objects, buckets and access policies stay as they are.
  minio-volume:
    image: cgr.dev/chainguard/minio:latest
    profiles: ['core']
    user: '0'
    entrypoint: ['chown', '-R', '--from=0', '65532:65532', '/data']
    volumes:
      - minio:/data

  # The server image carries the client (mc) and a shell; Chainguard's client-only image has no
  # shell to run these steps with.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    profiles: ['core']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-lmsminio} ${MINIO_ROOT_PASSWORD:-lms_minio_password} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET_PRIVATE:-lms-private} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET_PUBLIC:-lms-public} &&
      mc anonymous set download local/${STORAGE_BUCKET_PUBLIC:-lms-public} &&
      echo buckets-ready
      "

  mailpit:
    image: axllent/mailpit:latest
    profiles: ['core']
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  adminer:
    image: adminer:latest
    profiles: ['tools']
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      - postgres

volumes:
  pgdata:
  minio:
