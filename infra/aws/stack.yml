AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SI Academy on AWS (ADR-0042): CloudFront in front of a private Application Load Balancer and one
  Docker host (the API with its worker, the web app, the sandbox runner), RDS PostgreSQL 16 with
  pgvector, S3, Secrets Manager, ECR and CloudWatch. Created and changed only by
  .github/workflows/deploy-production.yml (operating rule 41).

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
    Description: Part of every resource name (si-academy-<environment>).
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: '^\d{1,3}\.\d{1,3}\.0\.0/16$'
    Description: The network; four /24 subnets are cut from it.
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >-
      The managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region (the
      deploy workflow looks it up).
  HostAmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 LTS (amd64) for the host. Resolved once, when the stack is created; a new value
      replaces the host.
  HostInstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large, t3.xlarge, m7i.large, m7i.xlarge]
  HostVolumeGiB:
    Type: Number
    Default: 50
    MinValue: 30
    MaxValue: 500
  DbEngineVersion:
    Type: String
    AllowedPattern: '^16\.\d+$'
    Description: >-
      PostgreSQL 16 minor version, 16.5 or later for pgvector 0.8. Resolved once, when the stack is
      created; minor upgrades then happen in the maintenance window.
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large, db.m7g.large]
  DbAllocatedStorageGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  DbMaxAllocatedStorageGiB:
    Type: Number
    Default: 100
    MinValue: 21
    MaxValue: 2000
  DbBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  DbMultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.-]+\.[a-z]{2,}$'
    Description: Optional custom domain (empty serves the site on the CloudFront domain).
  CertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:\d{12}:certificate/[0-9a-f-]+$'
    Description: ACM certificate in us-east-1 for DomainName (CloudFront needs it there).
  AlarmEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s"]+@[^@\s"]+\.[^@\s"]+$'
    Description: Optional address for alarms and the budget (it must confirm the subscription).
  MonthlyBudgetUsd:
    Type: Number
    Default: 200
    MinValue: 0
    Description: Monthly cost budget for the account, in US dollars (0 or no AlarmEmail, none).
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 180, 365]
  ClientKey:
    Type: String
    Default: si-academy
    AllowedPattern: '^[a-z0-9-]{2,40}$'
    Description: The client overlay the base seed applies (clients/<key>).
  AdminEmail:
    Type: String
    Default: superadmin@siacademy.example
    AllowedPattern: '^[^@\s"]+@[^@\s"]+\.[^@\s"]+$'
    Description: The first Super Admin, created once by the first release.
  EmailDriver:
    Type: String
    Default: none
    AllowedValues: [none, ses]
    Description: none until Amazon SES has a verified sender and production access.
  EmailFrom:
    Type: String
    Default: SI Academy <no-reply@siacademy.example>
    AllowedPattern: '^[^"\\$]+$'
  RunnerConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 8
  AiProvider:
    Type: String
    Default: none
    AllowedValues: [none, gemini]
    Description: none until the client approves AI (operating rules 35 and 48).
  AiModel:
    Type: String
    Default: ''
    AllowedPattern: '^[a-z0-9.:_-]*$'
  AiTaskModels:
    Type: String
    Default: ''
    AllowedPattern: '^[a-z0-9.:_=,-]*$'
  AiFallbackProvider:
    Type: String
    Default: ''
    AllowedValues: ['', groq]
  AiFallbackModel:
    Type: String
    Default: ''
    AllowedPattern: '^[a-z0-9.:_/-]*$'
  AiDataClasses:
    Type: String
    Default: public,course
    AllowedValues: [public, 'public,course']
    Description: >-
      Never personal here: the learner's own records reach a provider only after ADR-0041's terms
      are recorded and this list is changed in a reviewed commit.
  AiModelCosts:
    Type: String
    Default: ''
    AllowedPattern: '^[a-z0-9.:_=/,-]*$'
  AiOrgMonthlyBudgetUsd:
    Type: String
    Default: ''
    AllowedPattern: '^$|^\d{1,7}(\.\d{1,2})?$'
  AiKnowledgeAnswerMinSimilarity:
    Type: String
    Default: '0.71'
    AllowedPattern: '^$|^(0(\.\d{1,3})?|1(\.0{1,3})?)$'

Rules:
  DomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: A custom domain needs an ACM certificate in us-east-1 (CertificateArn).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasBudget: !And [!Condition HasAlarmEmail, !Not [!Equals [!Ref MonthlyBudgetUsd, '0']]]
  UseSes: !Equals [!Ref EmailDriver, ses]
  IsMultiAz: !Equals [!Ref DbMultiAz, 'true']

Resources:
  # ── Network: two public subnets (the NAT gateway) and two private ones (load balancer, host,
  # database). Nothing in the private subnets is reachable from the internet.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-public-a'

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-public-b'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-private-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-public'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-nat'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatAddress.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-private'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # S3 (release bundles, image layers from ECR) stays inside AWS, off the NAT gateway.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ── Security groups: CloudFront → load balancer → host → database, and nothing else.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SI Academy load balancer, reached only by CloudFront (VPC origin)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: CloudFront origin-facing addresses
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-alb'

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SI Academy host, reached only by its load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Web app
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - Description: API
          IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-host'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SI Academy database, reached only by the host
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: PostgreSQL from the host
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref HostSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-db'

  # ── Secrets: generated inside AWS, read only by the host at release time. None is an output,
  # none is printed, none reaches GitHub.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/database'
      Description: RDS master user (the API's own user).
      GenerateSecretString:
        SecretStringTemplate: '{"username":"si_academy"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  JwtAccessSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/jwt-access'
      Description: JWT_ACCESS_SECRET
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  JwtRefreshSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/jwt-refresh'
      Description: JWT_REFRESH_SECRET
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  DataEncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/data-encryption-key'
      Description: >-
        DATA_ENCRYPTION_KEY (seals integration secrets in the database; changing it means entering
        them again)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  RunnerTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/runner-token'
      Description: RUNNER_TOKEN, shared by the API and the sandbox runner only (ADR-0016)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/admin'
      Description: >-
        The first Super Admin's sign-in, used once by the first release. Read it in the console,
        sign in, and change the password.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"email":"${AdminEmail}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
        RequireEachIncludedType: true

  # ── Object storage. The S3 driver signs with access keys (no instance role yet), so the API
  # has a user of its own that can touch these two buckets and nothing else.
  PrivateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'si-academy-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-private'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      # Browsers upload with signed links straight to S3, from the site's own address only.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !If
              - HasDomain
              - [!Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
              - [!Sub 'https://${Distribution.DomainName}']
            AllowedMethods: [GET, HEAD, PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  PublicBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'si-academy-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-public'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # "Public" files (logos, the sign-in photograph) are served by CloudFront under /files;
      # the bucket itself stays private.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !If
              - HasDomain
              - [!Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
              - [!Sub 'https://${Distribution.DomainName}']
            AllowedMethods: [GET, HEAD, PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  PrivateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PrivateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PrivateBucket.Arn
              - !Sub '${PrivateBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  PublicBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PublicBucket.Arn
              - !Sub '${PublicBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: CloudFrontReadsFiles
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PublicBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  StorageUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'si-academy-${EnvironmentName}-storage'
      Policies:
        - PolicyName: buckets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !GetAtt PrivateBucket.Arn
                  - !GetAtt PublicBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${PrivateBucket.Arn}/*'
                  - !Sub '${PublicBucket.Arn}/*'

  # Raise Serial to rotate the key: the next release hands the new one to the API.
  StorageAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref StorageUser
      Serial: 1

  StorageSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/storage'
      Description: S3_ACCESS_KEY and S3_SECRET_KEY for the API (the two buckets only).
      SecretString: !Sub '{"accessKeyId":"${StorageAccessKey}","secretAccessKey":"${StorageAccessKey.SecretAccessKey}"}'

  # Amazon SES (optional): its SMTP password is derived from this key on the host at release time.
  MailUser:
    Type: AWS::IAM::User
    Condition: UseSes
    Properties:
      UserName: !Sub 'si-academy-${EnvironmentName}-mail'
      Policies:
        - PolicyName: send
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: '*'

  MailAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: UseSes
    Properties:
      UserName: !Ref MailUser
      Serial: 1

  MailSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseSes
    Properties:
      Name: !Sub 'si-academy/${EnvironmentName}/mail'
      Description: Amazon SES sending key (the SMTP password is derived from it).
      SecretString: !Sub '{"accessKeyId":"${MailAccessKey}","secretAccessKey":"${MailAccessKey.SecretAccessKey}"}'

  # ── Database: PostgreSQL 16 with pgvector (CREATE EXTENSION is in the Phase 8C migration),
  # encrypted, TLS required, backed up daily, protected from deletion.
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: SI Academy database, private subnets
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: SI Academy - TLS required, slow statements logged
      Parameters:
        rds.force_ssl: '1'
        log_min_duration_statement: '1000'

  DatabaseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/rds/instance/si-academy-${EnvironmentName}/postgresql'
      RetentionInDays: !Ref LogRetentionDays

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    DependsOn: DatabaseLogGroup
    Properties:
      DBInstanceIdentifier: !Sub 'si-academy-${EnvironmentName}'
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: lms
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      AllocatedStorage: !Ref DbAllocatedStorageGiB
      MaxAllocatedStorage: !Ref DbMaxAllocatedStorageGiB
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !If [IsMultiAz, true, false]
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      # 00:00-01:00 and Monday 01:30-02:30 in India.
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      PreferredBackupWindow: '18:30-19:30'
      PreferredMaintenanceWindow: 'sun:20:00-sun:21:00'
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnableCloudwatchLogsExports:
        - postgresql
      CACertificateIdentifier: rds-ca-rsa2048-g1

  # ── Images, by commit (the deploy workflow builds and pushes them).
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'si-academy-${EnvironmentName}/lms-api'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  ApiReleaseRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'si-academy-${EnvironmentName}/lms-api-release'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  WebRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'si-academy-${EnvironmentName}/lms-web'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  RunnerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'si-academy-${EnvironmentName}/lms-runner'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  SandboxRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'si-academy-${EnvironmentName}/lms-sandbox'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  # ── Logs (the containers write through Docker's awslogs driver; releases through SSM).
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/si-academy/${EnvironmentName}/api'
      RetentionInDays: !Ref LogRetentionDays

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/si-academy/${EnvironmentName}/web'
      RetentionInDays: !Ref LogRetentionDays

  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/si-academy/${EnvironmentName}/runner'
      RetentionInDays: !Ref LogRetentionDays

  ReleaseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/si-academy/${EnvironmentName}/release'
      RetentionInDays: !Ref LogRetentionDays

  # ── The host: Ubuntu 24.04 with Docker, in a private subnet, reached only by the load balancer
  # and administered only through SSM (no SSH, no key pair, no public address).
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'si-academy-${EnvironmentName}-host'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/si-academy-${EnvironmentName}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:si-academy/${EnvironmentName}/*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/si-academy/${EnvironmentName}/*'
              # Release bundles, in the pipeline bucket the account bootstrap made (bootstrap.yml).
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::si-academy-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-pipeline/releases/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::si-academy-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-pipeline'
                Condition:
                  StringLike:
                    's3:prefix': ['releases/*']
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt ApiLogGroup.Arn
                  - !GetAtt WebLogGroup.Arn
                  - !GetAtt RunnerLogGroup.Arn
                  - !GetAtt ReleaseLogGroup.Arn

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HostRole

  # IMDSv2 only, one hop: the containers cannot borrow the host's role.
  HostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'si-academy-${EnvironmentName}-host'
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1

  HostInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRoute
      - PrivateSubnetARoutes
      - S3Endpoint
    Properties:
      ImageId: !Ref HostAmiId
      InstanceType: !Ref HostInstanceType
      IamInstanceProfile: !Ref HostInstanceProfile
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref HostSecurityGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref HostLaunchTemplate
        Version: !GetAtt HostLaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref HostVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub 'si-academy-${EnvironmentName}-host'
        - Key: Role
          Value: host
      # First boot only (releases do the rest, infra/aws/host/release.sh): Docker with Compose,
      # the AWS CLI, the CloudWatch agent (memory and disk), some swap, the RDS certificate
      # authority. No secret is written here.
      UserData: !Base64
        Fn::Sub: |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          APP=/opt/si-academy
          mkdir -p $APP/certs $APP/releases
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          echo 'vm.swappiness=10' > /etc/sysctl.d/90-si-academy.conf
          sysctl --system
          apt-get update
          apt-get install -y docker.io docker-compose-v2 python3 curl ca-certificates
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'JSON'
          {"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}, "live-restore": true}
          JSON
          systemctl enable docker
          systemctl restart docker
          snap install aws-cli --classic
          curl -fsSL -o /tmp/amazon-cloudwatch-agent.deb https://amazoncloudwatch-agent-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E /tmp/amazon-cloudwatch-agent.deb
          cat > /opt/aws/amazon-cloudwatch-agent/etc/si-academy.json <<'JSON'
          {"agent": {"metrics_collection_interval": 60},
           "metrics": {"namespace": "SIAcademy/Host",
             "append_dimensions": {"InstanceId": "${!aws:InstanceId}"},
             "aggregation_dimensions": [["InstanceId"]],
             "metrics_collected": {"mem": {"measurement": ["mem_used_percent"]},
               "disk": {"measurement": ["used_percent"], "resources": ["/"], "drop_device": true}}}}
          JSON
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/si-academy.json
          curl -fsSL -o $APP/certs/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          chmod 644 $APP/certs/rds-global-bundle.pem
          date -u +%FT%TZ > $APP/.host-ready

  # ── Load balancer: internal, in the private subnets. The API keeps its single trusted proxy
  # hop (app.setup.ts, `trust proxy` 1): the load balancer passes CloudFront's X-Forwarded-For on
  # unchanged, so the address the API sees is the one CloudFront saw.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'si-academy-${EnvironmentName}'
      Type: application
      Scheme: internal
      Subnets:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'
        - Key: routing.http.xff_header_processing.mode
          Value: preserve
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'si-academy-${EnvironmentName}-api'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 4000
      TargetType: instance
      Targets:
        - Id: !Ref HostInstance
          Port: 4000
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'si-academy-${EnvironmentName}-web'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      Targets:
        - Id: !Ref HostInstance
          Port: 3000
      HealthCheckProtocol: HTTP
      HealthCheckPath: /login
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # The API mounts itself at /api/v1; its health routes stay inside the network.
  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ['/api/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # ── CloudFront: HTTPS for everyone, the private load balancer through a VPC origin, public
  # files from S3 under /files, the web app's hashed assets cached at the edge.
  AppVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub 'si-academy-${EnvironmentName}-alb'
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  FilesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'si-academy-${EnvironmentName}-files'
        Description: CloudFront reads the public bucket; nothing else may
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3_PUBLIC_BASE_URL is https://<site>/files: the object's key is what follows /files/.
  FilesPathFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'si-academy-${EnvironmentName}-files-path'
      AutoPublish: true
      FunctionConfig:
        Comment: Drops the /files prefix before the request reaches S3
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/files\//, '/');
          return request;
        }

  # A public file is never run as a page of this site (Phase 6).
  FilesResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'si-academy-${EnvironmentName}-files'
        Comment: Public files are inert
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: sandbox
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'SI Academy ${EnvironmentName}'
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # India is in PriceClass_200, not in PriceClass_100.
        PriceClass: PriceClass_200
        Origins:
          - Id: app
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt AppVpcOrigin.Id
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 30
          - Id: files
            DomainName: !Sub 'si-academy-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-public.s3.${AWS::Region}.amazonaws.com'
            OriginAccessControlId: !GetAtt FilesOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        # Pages and the API: never cached, every header, cookie and query string passed on.
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
          Compress: true
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            Compress: true
          - PathPattern: /files/*
            TargetOriginId: files
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref FilesResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt FilesPathFunction.FunctionARN
            Compress: true

  # ── What a release reads besides the secrets (infra/aws/host/render_env.py). Not secret.
  ReleaseConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/si-academy/${EnvironmentName}/config'
      Type: String
      Tier: Standard
      Description: Non-secret configuration for releases on the host
      Value: !Sub
        - |
          {
            "environment": "${EnvironmentName}",
            "region": "${AWS::Region}",
            "siteHost": "${SiteHost}",
            "registry": "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/si-academy-${EnvironmentName}",
            "database": {"host": "${Database.Endpoint.Address}", "port": "${Database.Endpoint.Port}", "name": "lms"},
            "buckets": {"private": "${PrivateBucket}", "public": "${PublicBucket}"},
            "logGroups": {"api": "${ApiLogGroup}", "web": "${WebLogGroup}", "runner": "${RunnerLogGroup}"},
            "clientKey": "${ClientKey}",
            "email": {"driver": "${EmailDriver}", "from": "${EmailFrom}"},
            "runnerConcurrency": "${RunnerConcurrency}",
            "ai": {
              "provider": "${AiProvider}",
              "model": "${AiModel}",
              "taskModels": "${AiTaskModels}",
              "fallbackProvider": "${AiFallbackProvider}",
              "fallbackModel": "${AiFallbackModel}",
              "dataClasses": "${AiDataClasses}",
              "modelCosts": "${AiModelCosts}",
              "orgMonthlyBudgetUsd": "${AiOrgMonthlyBudgetUsd}",
              "knowledgeAnswerMinSimilarity": "${AiKnowledgeAnswerMinSimilarity}"
            }
          }
        - SiteHost: !If [HasDomain, !Ref DomainName, !GetAtt Distribution.DomainName]

  # ── Alarms (to the topic; to the address once it confirms), and the budget.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'si-academy-${EnvironmentName}-alarms'

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  HostSystemCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-host-system-check'
      AlarmDescription: The host failed an AWS system check; EC2 recovers it onto healthy hardware.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - Name: InstanceId
          Value: !Ref HostInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover'
        - !Ref AlarmTopic

  HostInstanceCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-host-instance-check'
      AlarmDescription: The host's operating system stopped answering; EC2 reboots it.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions:
        - Name: InstanceId
          Value: !Ref HostInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:automate:${AWS::Region}:ec2:reboot'
        - !Ref AlarmTopic

  HostCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-host-cpu'
      AlarmDescription: The host's CPU has been above 85% for 15 minutes.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref HostInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

  HostMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-host-memory'
      AlarmDescription: The host's memory has been above 90% for 15 minutes.
      Namespace: SIAcademy/Host
      MetricName: mem_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref HostInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmTopic

  HostDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-host-disk'
      AlarmDescription: The host's disk is more than 85% full (old images; release logs).
      Namespace: SIAcademy/Host
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref HostInstance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmTopic

  ApiHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-api-health'
      AlarmDescription: The API has failed its readiness check (database and storage) for 3 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ApiTargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  WebHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-web-health'
      AlarmDescription: The web app has not answered its health check for 3 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-5xx'
      AlarmDescription: More than 25 server errors from the app in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  LoadBalancerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-alb-5xx'
      AlarmDescription: The load balancer itself answered more than 10 errors in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-db-cpu'
      AlarmDescription: The database's CPU has been above 80% for 15 minutes.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-db-storage'
      AlarmDescription: The database has less than 2 GiB of free storage.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

  DatabaseMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'si-academy-${EnvironmentName}-db-memory'
      AlarmDescription: The database has had less than 128 MiB of free memory for 15 minutes.
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 134217728
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub 'si-academy-${EnvironmentName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail

Outputs:
  SiteUrl:
    Description: Where SI Academy answers
    Value: !Sub
      - 'https://${SiteHost}'
      - SiteHost: !If [HasDomain, !Ref DomainName, !GetAtt Distribution.DomainName]
  SiteHost:
    Value: !If [HasDomain, !Ref DomainName, !GetAtt Distribution.DomainName]
  CloudFrontDomainName:
    Description: The DNS target for a custom domain (CNAME or alias)
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  HostInstanceId:
    Value: !Ref HostInstance
  DatabaseInstanceId:
    Value: !Ref Database
  Registry:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/si-academy-${EnvironmentName}'
  ApiTargetGroupArn:
    Value: !Ref ApiTargetGroup
  WebTargetGroupArn:
    Value: !Ref WebTargetGroup
  ReleaseLogGroup:
    Value: !Ref ReleaseLogGroup
  AdminSecretName:
    Description: The first Super Admin's sign-in (read it in the Secrets Manager console)
    Value: !Sub 'si-academy/${EnvironmentName}/admin'
  AlarmTopicArn:
    Value: !Ref AlarmTopic
