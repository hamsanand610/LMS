AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SI Academy, once per AWS account (ADR-0042): the role the production deploy workflow assumes, who
  may assume it (GitHub's OpenID Connect from this repository's `production` environment, or a
  deploy user that can do nothing but assume it), the role CloudFormation uses to change the
  production stack, and the pipeline bucket. No access key is created here.

Parameters:
  GitHubOwner:
    Type: String
    Default: hamsanand610
  GitHubRepository:
    Type: String
    Default: LMS
  GitHubEnvironment:
    Type: String
    Default: production
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  DeployAuth:
    Type: String
    Default: iam-user
    AllowedValues: [iam-user, oidc]
    Description: >-
      How GitHub reaches the deploy role. oidc (preferred, no stored key) needs the organization to
      allow iam:CreateOpenIDConnectProvider, which it denies today; iam-user is a deploy user whose
      only permission is to assume the role, its key kept in GitHub's production environment.
  CreateOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: With oidc, true unless the account already trusts token.actions.githubusercontent.com.
  HostInstanceId:
    Type: String
    AllowedPattern: '^i-[0-9a-f]{8,17}$'
    Description: The existing host the deploy workflow adopts (tags, role, security group, IMDS).
  HostOwnSecurityGroupId:
    Type: String
    AllowedPattern: '^sg-[0-9a-f]{8,17}$'
    Description: The host's own group (launch-wizard-1), whose public ports 80 and 443 are closed.

Conditions:
  UseOidc: !Equals [!Ref DeployAuth, oidc]
  UseDeployUser: !Not [!Condition UseOidc]
  CreateProvider: !And [!Condition UseOidc, !Equals [!Ref CreateOidcProvider, 'true']]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The pipeline's own files: the stack's template (too large to send inline) and the release
  # bundles the host downloads (the compose file and its scripts). No secret is ever put here.
  PipelineBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'si-academy-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-pipeline'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: old-templates
            Status: Enabled
            Prefix: templates/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: old-releases
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  PipelineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PipelineBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PipelineBucket.Arn
              - !Sub '${PipelineBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # CloudFormation changes the stack with this role, never with the workflow's own: everything the
  # stack holds, and IAM only for names that start with si-academy-.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'si-academy-cfn-exec-${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess'
      Policies:
        - PolicyName: si-academy-iam
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/si-academy-*'
              - Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/si-academy-*'
              - Effect: Allow
                Action:
                  - iam:CreateUser
                  - iam:DeleteUser
                  - iam:GetUser
                  - iam:TagUser
                  - iam:UntagUser
                  - iam:PutUserPolicy
                  - iam:GetUserPolicy
                  - iam:DeleteUserPolicy
                  - iam:ListUserPolicies
                  - iam:ListAttachedUserPolicies
                  - iam:CreateAccessKey
                  - iam:DeleteAccessKey
                  - iam:UpdateAccessKey
                  - iam:ListAccessKeys
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/si-academy-*'
              - Effect: Allow
                Action:
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRoles
                  - iam:CreateServiceLinkedRole
                Resource: '*'

  # The fallback while the organization denies OpenID Connect providers: a user that can do nothing
  # but assume the deploy role. Its access key is made by an administrator in the console and stored
  # only in GitHub's `production` environment secrets; rotate it, and delete it once OIDC is allowed.
  DeployUser:
    Type: AWS::IAM::User
    Condition: UseDeployUser
    Properties:
      UserName: !Sub 'si-academy-github-deployer-${EnvironmentName}'
      Policies:
        - PolicyName: assume-the-deploy-role
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/si-academy-github-deploy-${EnvironmentName}'

  # The deploy workflow's role: it may change the one stack (through the execution role), push
  # images, adopt the existing host, start a release on it, snapshot the database and read health.
  # It cannot read any secret.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'si-academy-github-deploy-${EnvironmentName}'
      MaxSessionDuration: 10800
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - UseOidc
            - Effect: Allow
              Principal:
                Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
              Action: sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                  'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}'
            - Effect: Allow
              Principal:
                AWS: !GetAtt DeployUser.Arn
              Action:
                - sts:AssumeRole
                - sts:TagSession
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TheStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/si-academy-${EnvironmentName}/*'
              - Sid: TemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: PassTheExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com
              - Sid: Images
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/si-academy-${EnvironmentName}/*'
              - Sid: RegistrySignIn
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: TemplatesAndReleaseBundles
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub '${PipelineBucket.Arn}/templates/*'
                  - !Sub '${PipelineBucket.Arn}/releases/*'
              - Sid: ReleaseOnTheHost
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'ssm:resourceTag/Application': si-academy
                    'ssm:resourceTag/Environment': !Ref EnvironmentName
              - Sid: TheReleaseDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Sid: ReleaseStatus
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: '*'
              - Sid: PreReleaseSnapshots
                Effect: Allow
                Action:
                  - rds:CreateDBSnapshot
                  - rds:AddTagsToResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:si-academy-${EnvironmentName}'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:si-academy-${EnvironmentName}-pre-release-*'
              - Sid: PrunePreReleaseSnapshots
                Effect: Allow
                Action: rds:DeleteDBSnapshot
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:si-academy-${EnvironmentName}-pre-release-*'
              # Adopting the existing host (infra/aws/pipeline/adopt-host.sh): that one instance and
              # its own security group only.
              - Sid: AdoptTheHostTags
                Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${HostInstanceId}'
                Condition:
                  ForAllValues:StringEquals:
                    'aws:TagKeys': [Application, Environment]
              - Sid: AdoptTheHost
                Effect: Allow
                Action:
                  - ec2:AssociateIamInstanceProfile
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:ModifyInstanceAttribute
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${HostInstanceId}'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
              - Sid: PassTheHostRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/si-academy-${EnvironmentName}-host'
                Condition:
                  StringEquals:
                    'iam:PassedToService': ec2.amazonaws.com
              - Sid: CloseThePublicPorts
                Effect: Allow
                Action: ec2:RevokeSecurityGroupIngress
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${HostOwnSecurityGroupId}'
              - Sid: ReadOnlyLookups
                Effect: Allow
                Action:
                  - ec2:DescribeManagedPrefixLists
                  - ec2:DescribeInstances
                  - ec2:DescribeIamInstanceProfileAssociations
                  - ec2:DescribeSecurityGroups
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBEngineVersions
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTargetGroups
                Resource: '*'
              - Sid: EdgeCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:GetDistribution
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  DeployUserName:
    Condition: UseDeployUser
    Description: Make its access key in the IAM console and store it only in GitHub (runbook)
    Value: !Ref DeployUser
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  PipelineBucketName:
    Value: !Ref PipelineBucket
