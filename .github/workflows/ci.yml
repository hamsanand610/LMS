# Lean pipeline for a private repository (architecture plan §23.2): lint, type-check, unit tests,
# API tests against PostgreSQL with pgvector (built from infra/postgres), production builds, the
# sandbox (real jobs in real containers, and every reference solution in the question bank), then a
# Playwright smoke run against the built web app, API and sandbox runner. Linux runners only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_DATABASE_URL: postgresql://lms:lms_ci_password@localhost:5432/lms?schema=public
  CI_TEST_DATABASE_URL: postgresql://lms:lms_ci_password@localhost:5432/lms_test?schema=public

jobs:
  checks:
    name: Lint, types, unit and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 with pgvector, built from infra/postgres as local and staging run it (ADR-0026,
      # Phase 8C). A service container cannot be built from the repository, so it starts here.
      - name: PostgreSQL with pgvector
        run: |
          docker build --tag lms-postgres:ci infra/postgres
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER=lms --env POSTGRES_PASSWORD=lms_ci_password --env POSTGRES_DB=lms \
            --health-cmd "pg_isready -U lms" --health-interval 2s --health-timeout 5s \
            --health-retries 30 lms-postgres:ci
          for attempt in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @lms/api db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: API tests (route table, auth, permissions, people, cohorts, notifications, queue)
        run: pnpm --filter @lms/api test:e2e
        env:
          TEST_DATABASE_URL: ${{ env.CI_TEST_DATABASE_URL }}
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

  # Learners' code runs only in the sandbox (ADR-0016). This job runs real jobs in real containers
  # (isolation, limits, every language, SQL) and then every reference solution in the question
  # bank, so content that no longer passes never reaches a learner.
  sandbox:
    name: Sandbox runner and question bank
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: infra/sandbox
          load: true
          tags: lms-sandbox:1
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Build the runner and what the API's scripts import
        run: pnpm exec turbo run build --filter=@lms/runner... --filter=@lms/api^...
      - name: Generate Prisma client
        run: pnpm --filter @lms/api db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - name: Jobs in real containers
        run: pnpm --filter @lms/runner test:sandbox
      - name: Every reference solution in the question bank
        run: pnpm --filter @lms/api verify:questions

  smoke:
    name: Playwright smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: checks
    env:
      APP_ENV: local
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else-0123456789
      WORKER_MODE: none
      EMAIL_DRIVER: none
      LOG_LEVEL: warn
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://localhost:4000
      # The journeys run and submit code, so the smoke run has a real sandbox runner.
      EXECUTION_DRIVER: runner
      RUNNER_URL: http://127.0.0.1:4100
      # Exports and uploads go to object storage (J-12 exports a report), so the smoke run has its
      # own MinIO, started by "Object storage for this run"; the secret key is made there too.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY: lms-ci
      S3_BUCKET_PRIVATE: lms-private
      S3_BUCKET_PUBLIC: lms-public
    steps:
      # A job's own `env` cannot read the workflow's `env` context (GitHub rejects the file), so the
      # CI database URL is exported once here, for every later step of this job.
      - name: Use the CI database
        run: echo "DATABASE_URL=$CI_DATABASE_URL" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # PostgreSQL 16 with pgvector, built from infra/postgres as local and staging run it (ADR-0026,
      # Phase 8C). A service container cannot be built from the repository, so it starts here.
      - name: PostgreSQL with pgvector
        run: |
          docker build --tag lms-postgres:ci infra/postgres
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER=lms --env POSTGRES_PASSWORD=lms_ci_password --env POSTGRES_DB=lms \
            --health-cmd "pg_isready -U lms" --health-interval 2s --health-timeout 5s \
            --health-retries 30 lms-postgres:ci
          for attempt in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lms/api db:generate
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: infra/sandbox
          load: true
          tags: lms-sandbox:1
          cache-from: type=gha,scope=sandbox
      - name: A runner token for this run
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "RUNNER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      # MinIO and the buckets infra/compose.yml creates, before the seed, which stores the client's
      # sign-in photograph in the public bucket. MinIO no longer publishes images, so this is
      # Chainguard's build of the same server and client (ADR-0017). The data lives on a fresh
      # tmpfs: the image's own /data is on the container's overlay, where MinIO cannot rename its
      # work folders.
      - name: Object storage for this run
        run: |
          SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$SECRET"
          echo "S3_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"
          # Handed to the containers by name, so the key never appears on a command line.
          export MINIO_ROOT_USER="$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$SECRET"
          export MC_HOST_local="http://$S3_ACCESS_KEY:$SECRET@localhost:9000"
          docker run -d --name minio -p 9000:9000 --tmpfs /data \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live > /dev/null && break
            sleep 1
          done
          mc() {
            docker run --rm --network host -e MC_HOST_local cgr.dev/chainguard/minio-client:latest "$@"
          }
          mc mb --ignore-existing "local/$S3_BUCKET_PRIVATE" "local/$S3_BUCKET_PUBLIC"
          mc anonymous set download "local/$S3_BUCKET_PUBLIC"
      - name: Generate a demo password for this run
        id: demo
        run: |
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)Demo1"
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
      - name: Migrate and seed
        run: |
          pnpm --filter @lms/api db:migrate
          pnpm --filter @lms/api db:seed
          SEED_DEMO_PASSWORD="${{ steps.demo.outputs.password }}" pnpm --filter @lms/api db:seed:demo
      - name: Create a throw-away Super Admin for this run
        id: admin
        run: |
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)!"
          pnpm --filter @lms/api cli users:create-admin --email e2e-admin@ci.local --name "CI Admin" --password "$PASSWORD" > /dev/null
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
      - name: Start the runner, API and web
        run: |
          (pnpm --filter @lms/runner start > runner.log 2>&1 &)
          (pnpm --filter @lms/api start > api.log 2>&1 &)
          (pnpm --filter @lms/web start > web.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4100/livez > /dev/null && curl -fsS http://localhost:4000/health/live > /dev/null && curl -fsS http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Servers did not start"; tail -n 50 runner.log api.log web.log; exit 1
      - name: Install Chromium
        run: pnpm --filter @lms/web exec playwright install --with-deps chromium
      - name: Smoke journeys
        run: pnpm --filter @lms/web exec playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: e2e-admin@ci.local
          E2E_ADMIN_PASSWORD: ${{ steps.admin.outputs.password }}
          E2E_TRAINER_EMAIL: trainer1@siacademy.example
          E2E_TRAINER_PASSWORD: ${{ steps.demo.outputs.password }}
          E2E_STUDENT_EMAIL: student01@siacademy.example
          E2E_STUDENT_PASSWORD: ${{ steps.demo.outputs.password }}
      - name: The same journeys on a phone (plan Phase 6)
        run: pnpm --filter @lms/web exec playwright test --project=mobile
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: e2e-admin@ci.local
          E2E_ADMIN_PASSWORD: ${{ steps.admin.outputs.password }}
          E2E_TRAINER_EMAIL: trainer1@siacademy.example
          E2E_TRAINER_PASSWORD: ${{ steps.demo.outputs.password }}
          E2E_STUDENT_EMAIL: student01@siacademy.example
          E2E_STUDENT_PASSWORD: ${{ steps.demo.outputs.password }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Building on every pull request is what proves the Dockerfiles still work; only a push to
      # main is worth pushing to the registry.
      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lms-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lms-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL || 'http://localhost:4000' }}
            NEXT_PUBLIC_APP_ENV=staging
            NEXT_PUBLIC_STORAGE_URL=${{ vars.STAGING_STORAGE_URL || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lms-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lms-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # The sandbox runner (ADR-0016) and the image it starts for every job.
      - name: Runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lms-runner:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lms-runner:latest
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: infra/sandbox
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lms-sandbox:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lms-sandbox:latest
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
